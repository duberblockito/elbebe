<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FFE5B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFACD;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bgGrad)"/>

  <!-- Animal 1: Cow -->
  <g transform="translate(60, 100)">
    <circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#333" stroke-width="2">
      <animate attributeName="fill" values="#FFFFFF;#FFE4B5;#FFFFFF" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-15" cy="-10" r="8" fill="#333"/>
    <circle cx="15" cy="-10" r="8" fill="#333"/>
    <ellipse cx="0" cy="10" rx="10" ry="8" fill="#FF69B4"/>
    <!-- Sound waves -->
    <path d="M 45 0 Q 55 -10 65 0 Q 55 10 45 0" fill="none" stroke="#FF6B6B" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="transform" values="translate(0,0); translate(5,0); translate(0,0)" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Animal 2: Dog -->
  <g transform="translate(150, 100)">
    <circle cx="0" cy="0" r="40" fill="#D2691E" stroke="#333" stroke-width="2">
      <animate attributeName="fill" values="#D2691E;#FFA07A;#D2691E" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="-18" cy="-5" rx="15" ry="12" fill="#8B4513"/>
    <ellipse cx="18" cy="-5" rx="15" ry="12" fill="#8B4513"/>
    <circle cx="-15" cy="-5" r="6" fill="#333"/>
    <circle cx="15" cy="-5" r="6" fill="#333"/>
    <ellipse cx="0" cy="12" rx="8" ry="6" fill="#000"/>
    <ellipse cx="-20" cy="20" rx="12" ry="20" fill="#8B4513"/>
    <ellipse cx="20" cy="20" rx="12" ry="20" fill="#8B4513"/>
    <!-- Sound waves -->
    <path d="M 45 0 Q 55 -10 65 0 Q 55 10 45 0" fill="none" stroke="#FF6B6B" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="transform" values="translate(0,0); translate(5,0); translate(0,0)" dur="1.2s" repeatCount="indefinite" begin="0.5s"/>
    </path>
  </g>

  <!-- Animal 3: Cat -->
  <g transform="translate(240, 100)">
    <circle cx="0" cy="0" r="40" fill="#808080" stroke="#333" stroke-width="2">
      <animate attributeName="fill" values="#808080;#A9A9A9;#808080" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Ears -->
    <polygon points="-30,-25 -20,-45 -10,-25" fill="#808080" stroke="#333" stroke-width="2">
      <animate attributeName="fill" values="#808080;#A9A9A9;#808080" dur="2.2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="30,-25 20,-45 10,-25" fill="#808080" stroke="#333" stroke-width="2">
      <animate attributeName="fill" values="#808080;#A9A9A9;#808080" dur="2.2s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="-12" cy="-5" r="8" fill="#333"/>
    <circle cx="12" cy="-5" r="8" fill="#333"/>
    <polygon points="-5,10 0,18 5,10" fill="#FF69B4"/>
    <line x1="-15" y1="5" x2="-5" y2="8" stroke="#333" stroke-width="2"/>
    <line x1="15" y1="5" x2="5" y2="8" stroke="#333" stroke-width="2"/>
    <!-- Sound waves -->
    <path d="M 45 0 Q 55 -10 65 0 Q 55 10 45 0" fill="none" stroke="#FF6B6B" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="transform" values="translate(0,0); translate(5,0); translate(0,0)" dur="1.3s" repeatCount="indefinite" begin="1s"/>
    </path>
  </g>

  <!-- Animal 4: Bird -->
  <g transform="translate(105, 200)">
    <circle cx="0" cy="0" r="35" fill="#87CEEB" stroke="#333" stroke-width="2">
      <animate attributeName="fill" values="#87CEEB;#B0E0E6;#87CEEB" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-10" cy="-5" r="6" fill="#333"/>
    <circle cx="10" cy="-5" r="6" fill="#333"/>
    <polygon points="5,5 20,8 5,11" fill="#FFA500"/>
    <ellipse cx="-25" cy="5" rx="15" ry="8" fill="#4682B4">
      <animate attributeName="rx" values="15;20;15" dur="0.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="25" cy="5" rx="15" ry="8" fill="#4682B4">
      <animate attributeName="rx" values="15;20;15" dur="0.5s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Sound waves -->
    <path d="M 40 0 Q 50 -10 60 0 Q 50 10 40 0" fill="none" stroke="#FF6B6B" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="transform" values="translate(0,0); translate(5,0); translate(0,0)" dur="1.1s" repeatCount="indefinite" begin="0.3s"/>
    </path>
  </g>

  <!-- Animal 5: Duck -->
  <g transform="translate(195, 200)">
    <circle cx="0" cy="0" r="35" fill="#FFD700" stroke="#333" stroke-width="2">
      <animate attributeName="fill" values="#FFD700;#FFEC8B;#FFD700" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-10" cy="-5" r="6" fill="#333"/>
    <circle cx="10" cy="-5" r="6" fill="#333"/>
    <ellipse cx="0" cy="10" rx="12" ry="8" fill="#FFA500"/>
    <ellipse cx="-15" cy="10" rx="8" ry="5" fill="#FFA500"/>
    <!-- Sound waves -->
    <path d="M 40 0 Q 50 -10 60 0 Q 50 10 40 0" fill="none" stroke="#FF6B6B" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="transform" values="translate(0,0); translate(5,0); translate(0,0)" dur="1.4s" repeatCount="indefinite" begin="0.7s"/>
    </path>
  </g>

  <!-- Title text -->
  <text x="150" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">🐮 Animalitos que Suenan 🐶</text>

  <!-- Progress bar indicator -->
  <rect x="50" y="270" width="200" height="15" fill="#E0E0E0" rx="7.5"/>
  <rect x="50" y="270" width="100" height="15" fill="#4CAF50" rx="7.5">
    <animate attributeName="width" values="100;150;100" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="150" y="282" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Nivel 1/5</text>
</svg>
