<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animalitos que Suenan | El Bebe</title>
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
  <div class="game-container">
    <div class="header">
      <h1 class="game-title">🐕 Animalitos que Suenan</h1>
      <p class="subtitle">Toca, Escucha y Aprende</p>
    </div>

    <div class="game-board" id="gameBoard">
      <!-- Animal icons will be generated by JavaScript -->
    </div>

    <div class="controls">
      <div class="instruction">Toca un animalito para escuchar el sonido</div>
    </div>

    <div class="footer">
      <button id="btn-home" class="btn-primary">
        <span class="icon">🏠</span> Inicio
      </button>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="../../js/main.js"></script>
</body>
</html>
