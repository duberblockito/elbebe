<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="30" fill="url(#bgGradient)"/>

  <!-- Title -->
  <text x="150" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Arrastra la Fruta
  </text>

  <!-- Plate -->
  <ellipse cx="150" cy="220" rx="80" ry="40" fill="#f5f5dc" stroke="#f39c12" stroke-width="3" filter="url(#shadow)"/>
  <ellipse cx="150" cy="220" rx="60" ry="30" fill="#faf0e6" stroke="#f39c12" stroke-width="2"/>

  <!-- Animated floating fruits -->
  <g>
    <!-- Apple -->
    <circle cx="80" cy="100" r="25" fill="#ff6b6b" filter="url(#shadow)">
      <animate attributeName="cy" values="100;90;100" dur="3s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <path d="M80 75 Q85 70 90 75" stroke="#8B4513" stroke-width="2" fill="none">
      <animate attributeName="cy" values="75;65;75" dur="3s" repeatCount="indefinite" begin="0s"/>
    </path>
    <ellipse cx="90" cy="77" rx="8" ry="6" fill="#90EE90" opacity="0.8">
      <animate attributeName="cy" values="77;67;77" dur="3s" repeatCount="indefinite" begin="0s"/>
    </ellipse>

    <!-- Orange -->
    <circle cx="220" cy="110" r="25" fill="#ffa500" filter="url(#shadow)">
      <animate attributeName="cy" values="110;100;110" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="215" cy="100" r="4" fill="#90EE90" opacity="0.6">
      <animate attributeName="cy" values="100;90;100" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </circle>

    <!-- Grape -->
    <circle cx="100" cy="180" r="20" fill="#9b59b6" filter="url(#shadow)">
      <animate attributeName="cy" values="180;170;180" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="85" cy="175" r="15" fill="#8e44ad">
      <animate attributeName="cy" values="175;165;175" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="115" cy="175" r="15" fill="#8e44ad">
      <animate attributeName="cy" values="175;165;175" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>

    <!-- Strawberry -->
    <ellipse cx="200" cy="175" rx="18" ry="22" fill="#e74c3c" filter="url(#shadow)">
      <animate attributeName="cy" values="175;165;175" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </ellipse>
    <polygon points="200,153 190,163 210,163" fill="#90EE90">
      <animate attributeName="points" values="200,153 190,163 210,163;200,143 190,153 210,153;200,153 190,163 210,163" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </polygon>

    <!-- Banana -->
    <path d="M150 140 Q165 120 180 140" stroke="#f1c40f" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#shadow)">
      <animate attributeName="d" values="M150 140 Q165 120 180 140;M150 130 Q165 110 180 130;M150 140 Q165 120 180 140" dur="3s" repeatCount="indefinite" begin="2s"/>
    </path>
  </g>

  <!-- Drag instruction -->
  <text x="150" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.9">
    🖱️ 👆 Arrastra al plato
  </text>

  <!-- Arrow pointing to plate -->
  <path d="M150 150 L150 175" stroke="white" stroke-width="3" fill="none" stroke-dasharray="5,5" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </path>
  <polygon points="145 170 155 170 150 180" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </polygon>
</svg>
