<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constructor de Palabras - Juegos El Bebe</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="assets/game.css">
</head>
<body>
    <div class="game-container">
        <!-- Game Header -->
        <div class="game-header">
            <div class="game-info">
                <h1>🏗️ Constructor de Palabras</h1>
                <div class="game-stats">
                    <span class="level-display">Nivel: <span id="level">1</span></span>
                    <span class="score-display">Puntos: <span id="score">0</span></span>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span class="progress-text"><span id="progress-text">0/5</span></span>
            </div>
        </div>

        <!-- Game Area -->
        <div class="game-area">
            <!-- Word Display -->
            <div class="word-display">
                <div class="word-image" id="word-image">
                    <img src="" alt="Palabra" id="current-word-image">
                </div>
                <div class="word-hint" id="word-hint"></div>
            </div>

            <!-- Letter Slots -->
            <div class="letter-slots" id="letter-slots">
                <!-- Slots will be generated by JavaScript -->
            </div>

            <!-- Letter Tiles -->
            <div class="letter-tiles" id="letter-tiles">
                <!-- Tiles will be generated by JavaScript -->
            </div>

            <!-- Feedback Message -->
            <div class="feedback-message" id="feedback-message"></div>
        </div>

        <!-- Game Controls -->
        <div class="game-controls">
            <button class="btn btn-secondary" id="reset-btn">🔄 Reiniciar</button>
            <button class="btn btn-primary" id="next-btn" disabled>➡️ Siguiente</button>
        </div>

        <!-- Game Over Modal -->
        <div class="modal" id="game-over-modal">
            <div class="modal-content">
                <h2>🎉 ¡Nivel Completado!</h2>
                <div class="level-stats">
                    <p>Puntos: <span id="final-score">0</span></p>
                    <p>Palabras: <span id="words-completed">0</span>/5</p>
                </div>
                <button class="btn btn-primary" id="next-level-btn">Siguiente Nivel</button>
                <button class="btn btn-secondary" id="back-home-btn">🏠 Volver al Inicio</button>
            </div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
