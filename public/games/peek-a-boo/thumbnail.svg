<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#bg)" />

  <!-- Door Icon -->
  <rect x="75" y="60" width="150" height="180" rx="15" fill="#8B4513" stroke="#654321" stroke-width="8" />
  <circle cx="200" cy="150" r="20" fill="#ffd700" stroke="#cc8800" stroke-width="3" />

  <!-- Text -->
  <text x="150" y="260" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Peek-a-Boo</text>
  <text x="150" y="285" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.8">Animales que Salen</text>
</svg>
