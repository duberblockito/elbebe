<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conejo Programador - El Bebe Games</title>
    <link rel="stylesheet" href="assets/game.css">
</head>
<body>
    <div class="game-container">
        <!-- Header con HUD -->
        <div class="game-header">
            <div class="level-info">
                <span class="level-label">Nivel</span>
                <span class="level-number" id="levelNumber">1</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="progress-text" id="progressText">0/5</span>
            </div>
            <div class="timer-container">
                <div class="timer-bar" id="timerBar">
                    <div class="timer-fill" id="timerFill"></div>
                </div>
                <span class="timer-text" id="timerText">60s</span>
            </div>
        </div>

        <!-- Grid del juego -->
        <div class="grid-container" id="gridContainer">
            <!-- El grid se generará con JavaScript -->
        </div>

        <!-- Área de comandos -->
        <div class="commands-area">
            <div class="command-queue" id="commandQueue">
                <div class="queue-placeholder">
                    <span>Añade comandos aquí</span>
                </div>
            </div>
            <div class="command-buttons">
                <button class="command-btn up" data-command="up" aria-label="Arriba">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 4l-8 8h6v8h4v-8h6z"/>
                    </svg>
                </button>
                <button class="command-btn down" data-command="down" aria-label="Abajo">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 20l8-8h-6V4h-4v8H4z"/>
                    </svg>
                </button>
                <button class="command-btn left" data-command="left" aria-label="Izquierda">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4 12l8-8v6h8v4h-8v6z"/>
                    </svg>
                </button>
                <button class="command-btn right" data-command="right" aria-label="Derecha">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 12l-8 8v-6H4v-4h8V4z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Botones de control -->
        <div class="control-buttons">
            <button class="control-btn play" id="playBtn" aria-label="Ejecutar">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <span>¡Ejecutar!</span>
            </button>
            <button class="control-btn reset" id="resetBtn" aria-label="Reiniciar">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
                <span>Reiniciar</span>
            </button>
            <button class="control-btn clear" id="clearBtn" aria-label="Limpiar comandos">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                </svg>
                <span>Limpiar</span>
            </button>
        </div>
    </div>

    <!-- Modal de éxito -->
    <div class="modal" id="successModal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2>¡Excelente!</h2>
            <p class="modal-message">¡El conejo encontró la zanahoria!</p>
            <button class="modal-btn" id="nextLevelBtn">Siguiente Nivel</button>
        </div>
    </div>

    <!-- Modal de nivel completado -->
    <div class="modal" id="levelCompleteModal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-icon">🌟</div>
            <h2>¡Nivel Completado!</h2>
            <p class="modal-message">¡Eres un gran programador!</p>
            <button class="modal-btn" id="continueBtn">Continuar</button>
        </div>
    </div>

    <!-- Modal de tiempo agotado -->
    <div class="modal" id="timeoutModal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-icon">⏰</div>
            <h2>¡Tiempo Agotado!</h2>
            <p class="modal-message">¡Inténtalo de nuevo!</p>
            <button class="modal-btn" id="retryBtn">Intentar de Nuevo</button>
        </div>
    </div>

    <!-- Modal de juego completado -->
    <div class="modal" id="gameCompleteModal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-icon">🏆</div>
            <h2>¡Juego Completado!</h2>
            <p class="modal-message">¡Has completado todos los niveles!</p>
            <button class="modal-btn" id="playAgainBtn">Jugar de Nuevo</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
