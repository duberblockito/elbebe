<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Background -->
  <rect width="300" height="300" fill="#667eea" rx="20" ry="20"/>
  
  <!-- Grid pattern -->
  <g fill="#764ba2" opacity="0.3">
    <rect x="50" y="50" width="50" height="50" rx="5"/>
    <rect x="110" y="50" width="50" height="50" rx="5"/>
    <rect x="170" y="50" width="50" height="50" rx="5"/>
    <rect x="230" y="50" width="50" height="50" rx="5"/>
    <rect x="50" y="110" width="50" height="50" rx="5"/>
    <rect x="110" y="110" width="50" height="50" rx="5"/>
    <rect x="170" y="110" width="50" height="50" rx="5"/>
    <rect x="230" y="110" width="50" height="50" rx="5"/>
    <rect x="50" y="170" width="50" height="50" rx="5"/>
    <rect x="110" y="170" width="50" height="50" rx="5"/>
    <rect x="170" y="170" width="50" height="50" rx="5"/>
    <rect x="230" y="170" width="50" height="50" rx="5"/>
    <rect x="50" y="230" width="50" height="50" rx="5"/>
    <rect x="110" y="230" width="50" height="50" rx="5"/>
    <rect x="170" y="230" width="50" height="50" rx="5"/>
    <rect x="230" y="230" width="50" height="50" rx="5"/>
  </g>
  
  <!-- Rabbit -->
  <g transform="translate(60, 180)">
    <!-- Body -->
    <ellipse cx="20" cy="25" rx="15" ry="12" fill="#ffffff"/>
    <!-- Head -->
    <circle cx="20" cy="10" r="12" fill="#ffffff"/>
    <!-- Ears -->
    <ellipse cx="12" cy="-15" rx="4" ry="12" fill="#ffffff"/>
    <ellipse cx="28" cy="-15" rx="4" ry="12" fill="#ffffff"/>
    <!-- Inner ears -->
    <ellipse cx="12" cy="-15" rx="2" ry="8" fill="#ffb6c1"/>
    <ellipse cx="28" cy="-15" rx="2" ry="8" fill="#ffb6c1"/>
    <!-- Eyes -->
    <circle cx="15" cy="8" r="2" fill="#333"/>
    <circle cx="25" cy="8" r="2" fill="#333"/>
    <!-- Nose -->
    <ellipse cx="20" cy="12" rx="2" ry="1.5" fill="#ffb6c1"/>
    <!-- Smile -->
    <path d="M 15 16 Q 20 20 25 16" stroke="#333" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Carrot -->
  <g transform="translate(210, 60)">
    <!-- Carrot body -->
    <path d="M 10 30 L 20 60 L 30 30 Z" fill="#ff6b35"/>
    <path d="M 12 30 L 20 55 L 28 30 Z" fill="#ff8c5a"/>
    <!-- Carrot top -->
    <path d="M 20 30 L 15 20 L 18 25 L 20 18 L 22 25 L 25 20 Z" fill="#4caf50"/>
  </g>
  
  <!-- Arrow pointing from rabbit to carrot -->
  <g transform="translate(130, 110)">
    <path d="M 0 0 L 50 30" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 45 20 L 50 30 L 42 28" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  </g>
  
  <!-- Code brackets -->
  <g fill="#ffffff" opacity="0.9">
    <text x="40" y="280" font-family="monospace" font-size="28" font-weight="bold">{ }</text>
  </g>
</svg>
