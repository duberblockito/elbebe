<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#bgGradient)" rx="20"/>

  <!-- Island silhouette -->
  <path d="M50,250 Q100,180 150,220 Q200,160 250,250 Z" fill="#8B4513" opacity="0.7"/>

  <!-- Coding brackets -->
  <text x="150" y="100" text-anchor="middle" font-family="Courier New, monospace" font-size="80" fill="#FFD700" font-weight="bold">
    { }
  </text>

  <!-- Code lines -->
  <rect x="80" y="140" width="140" height="8" rx="4" fill="#4CAF50" opacity="0.9"/>
  <rect x="80" y="160" width="100" height="8" rx="4" fill="#4CAF50" opacity="0.8"/>
  <rect x="80" y="180" width="120" height="8" rx="4" fill="#4CAF50" opacity="0.7"/>

  <!-- Character icon (running person) -->
  <text x="150" y="240" text-anchor="middle" font-size="50">🏃</text>

  <!-- Goal icon (flag) -->
  <text x="230" y="200" font-size="40">🏁</text>

  <!-- Title -->
  <text x="150" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
    Code Quest
  </text>
</svg>
