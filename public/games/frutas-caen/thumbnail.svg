<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Background -->
  <rect width="300" height="300" fill="#fff5f5"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="130" fill="#ffe8e8"/>
  
  <!-- Falling fruits -->
  <g transform="translate(50, 60)">
    <circle cx="0" cy="0" r="35" fill="#ff6b6b"/>
    <path d="M-15 -20 Q0 -35 15 -20" stroke="#5c2c2c" stroke-width="3" fill="none"/>
    <circle cx="8" cy="-8" r="3" fill="#ffe8e8" opacity="0.6"/>
  </g>
  
  <g transform="translate(150, 100)">
    <circle cx="0" cy="0" r="30" fill="#ffa94d"/>
    <ellipse cx="0" cy="-18" rx="8" ry="5" fill="#ffd43b"/>
    <circle cx="6" cy="-6" r="2.5" fill="#ffe8e8" opacity="0.6"/>
  </g>
  
  <g transform="translate(250, 70)">
    <circle cx="0" cy="0" r="28" fill="#ffd43b"/>
    <path d="M-5 -20 Q0 -30 5 -20 L0 -15 Z" fill="#82c91e"/>
  </g>
  
  <g transform="translate(80, 150)">
    <ellipse cx="0" cy="0" rx="20" ry="25" fill="#9775fa"/>
    <ellipse cx="0" cy="-20" rx="8" ry="5" fill="#5f3dc4"/>
  </g>
  
  <g transform="translate(170, 180)">
    <ellipse cx="0" cy="0" rx="18" ry="22" fill="#faa2c1"/>
    <path d="M-3 -15 Q0 -22 3 -15 L0 -18 Z" fill="#c2255c"/>
  </g>
  
  <g transform="translate(220, 200)">
    <circle cx="0" cy="0" r="22" fill="#ff6b6b"/>
    <path d="M-8 -12 Q0 -20 8 -12" stroke="#5c2c2c" stroke-width="2" fill="none"/>
  </g>
  
  <g transform="translate(60, 230)">
    <circle cx="0" cy="0" r="25" fill="#8ce99a"/>
    <circle cx="5" cy="-5" r="2" fill="#69db7c"/>
  </g>
  
  <g transform="translate(140, 250)">
    <ellipse cx="0" cy="0" rx="15" ry="20" fill="#ffa94d"/>
    <ellipse cx="0" cy="-15" rx="6" ry="4" fill="#ffd43b"/>
  </g>
  
  <!-- Juice splash effect -->
  <g transform="translate(100, 130)" opacity="0.7">
    <circle cx="0" cy="0" r="8" fill="#ff6b6b"/>
    <circle cx="15" cy="-10" r="6" fill="#ff6b6b"/>
    <circle cx="-12" cy="12" r="5" fill="#ff6b6b"/>
    <circle cx="20" cy="8" r="4" fill="#ff6b6b"/>
    <circle cx="-15" cy="-8" r="5" fill="#ff6b6b"/>
  </g>
  
  <!-- Title -->
  <text x="150" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">Frutas que Caen</text>
</svg>
