<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFE66D;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#AA96DA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9F43;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with gradient -->
  <rect width="300" height="300" fill="url(#rainbow)" />

  <!-- Music note icon in center -->
  <text x="150" y="160" font-size="120" text-anchor="middle" fill="white"
        style="text-shadow: 2px 2px 8px rgba(0,0,0,0.3); font-weight: bold;">
    🎵
  </text>

  <!-- Vibration effect circles -->
  <circle cx="150" cy="150" r="60" fill="none" stroke="white" stroke-width="3" opacity="0.4" />
  <circle cx="150" cy="150" r="75" fill="none" stroke="white" stroke-width="2" opacity="0.3" />
  <circle cx="150" cy="150" r="90" fill="none" stroke="white" stroke-width="2" opacity="0.2" />

  <!-- Game title at bottom -->
  <text x="150" y="260" font-size="24" text-anchor="middle" fill="white"
        style="text-shadow: 1px 1px 4px rgba(0,0,0,0.5); font-weight: bold; font-family: Arial, sans-serif;">
    Colores que Vibran
  </text>

  <!-- Age badge -->
  <rect x="20" y="20" width="80" height="30" rx="15" fill="rgba(0,0,0,0.3)" />
  <text x="60" y="41" font-size="14" text-anchor="middle" fill="white" font-weight="bold">
    0-1 años
  </text>
</svg>
