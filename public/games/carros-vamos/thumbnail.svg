<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Background -->
  <rect width="300" height="300" fill="#4CAF50"/>

  <!-- Road -->
  <rect x="0" y="200" width="300" height="100" fill="#444"/>

  <!-- Car -->
  <g transform="translate(75, 130)">
    <!-- Car body -->
    <rect x="0" y="20" width="150" height="60" rx="10" fill="#FF4444"/>

    <!-- Car roof -->
    <rect x="30" y="0" width="90" height="40" rx="10" fill="#FF4444"/>

    <!-- Windows -->
    <rect x="35" y="5" width="35" height="30" rx="5" fill="#87CEEB"/>
    <rect x="80" y="5" width="35" height="30" rx="5" fill="#87CEEB"/>

    <!-- Wheels -->
    <circle cx="30" cy="80" r="20" fill="#333"/>
    <circle cx="30" cy="80" r="10" fill="#666"/>
    <circle cx="120" cy="80" r="20" fill="#333"/>
    <circle cx="120" cy="80" r="10" fill="#666"/>

    <!-- Headlights -->
    <circle cx="150" cy="40" r="8" fill="#FFD700"/>
    <circle cx="150" cy="60" r="8" fill="#FFD700"/>
  </g>

  <!-- Title -->
  <text x="150" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">Los Carros Vamos</text>
</svg>
