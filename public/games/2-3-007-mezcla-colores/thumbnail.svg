<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000044"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="20" fill="url(#bg-grad)" />

  <!-- Title -->
  <text x="150" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" filter="url(#shadow)">
    Mezcla los Colores
  </text>

  <!-- Puddles with mixing colors -->
  <g filter="url(#shadow)">
    <!-- Red puddle -->
    <circle cx="80" cy="120" r="40" fill="#ff6b6b" opacity="0.6" />
    <text x="80" y="128" text-anchor="middle" font-size="30">🔴</text>

    <!-- Yellow puddle -->
    <circle cx="220" cy="120" r="40" fill="#ffd93d" opacity="0.6" />
    <text x="220" y="128" text-anchor="middle" font-size="30">🟡</text>

    <!-- Mixed puddle (green) -->
    <circle cx="150" cy="200" r="45" fill="#32cd32" opacity="0.6" />
    <text x="150" y="208" text-anchor="middle" font-size="35">🟢</text>
  </g>

  <!-- Mixing arrows -->
  <g stroke="white" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 100 160 Q 125 180 130 190" marker-end="url(#arrowhead)" />
    <path d="M 200 160 Q 175 180 170 190" marker-end="url(#arrowhead)" />
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="white" />
    </marker>
  </defs>

  <!-- Drop icons -->
  <text x="60" y="80" font-size="24">💧</text>
  <text x="240" y="80" font-size="24">💧</text>

  <!-- Age group badge -->
  <rect x="230" y="255" width="60" height="25" rx="12" fill="rgba(255,255,255,0.3)" />
  <text x="260" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    2-3
  </text>
</svg>
