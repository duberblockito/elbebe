<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="20" ry="20" fill="url(#bg-gradient)"/>

  <!-- Title -->
  <text x="150" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    Caritas y Emociones
  </text>

  <!-- Happy Face -->
  <g transform="translate(50, 120)">
    <circle cx="50" cy="50" r="40" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="3"/>
    <circle cx="35" cy="40" r="6" fill="#2d3436"/>
    <circle cx="65" cy="40" r="6" fill="#2d3436"/>
    <path d="M 30 60 Q 50 75 70 60" stroke="#2d3436" stroke-width="3" fill="none"/>
    <text x="50" y="110" font-family="Arial" font-size="12" fill="white" text-anchor="middle">😊</text>
  </g>

  <!-- Sad Face -->
  <g transform="translate(200, 120)">
    <circle cx="50" cy="50" r="40" fill="#74b9ff" stroke="#0984e3" stroke-width="3"/>
    <circle cx="35" cy="40" r="6" fill="#2d3436"/>
    <circle cx="65" cy="40" r="6" fill="#2d3436"/>
    <path d="M 30 70 Q 50 55 70 70" stroke="#2d3436" stroke-width="3" fill="none"/>
    <text x="50" y="110" font-family="Arial" font-size="12" fill="white" text-anchor="middle">😢</text>
  </g>

  <!-- Angry Face -->
  <g transform="translate(50, 220)">
    <circle cx="50" cy="50" r="40" fill="#ff7675" stroke="#d63031" stroke-width="3"/>
    <line x1="25" y1="35" x2="40" y2="40" stroke="#2d3436" stroke-width="3"/>
    <line x1="75" y1="35" x2="60" y2="40" stroke="#2d3436" stroke-width="3"/>
    <circle cx="35" cy="45" r="6" fill="#2d3436"/>
    <circle cx="65" cy="45" r="6" fill="#2d3436"/>
    <path d="M 35 65 Q 50 55 65 65" stroke="#2d3436" stroke-width="3" fill="none"/>
    <text x="50" y="110" font-family="Arial" font-size="12" fill="white" text-anchor="middle">😠</text>
  </g>

  <!-- Surprised Face -->
  <g transform="translate(200, 220)">
    <circle cx="50" cy="50" r="40" fill="#55efc4" stroke="#00b894" stroke-width="3"/>
    <circle cx="35" cy="40" r="8" fill="#2d3436"/>
    <circle cx="65" cy="40" r="8" fill="#2d3436"/>
    <circle cx="50" cy="65" r="12" fill="#2d3436"/>
    <text x="50" y="110" font-family="Arial" font-size="12" fill="white" text-anchor="middle">😲</text>
  </g>
</svg>
