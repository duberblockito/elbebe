<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Background -->
  <rect width="300" height="300" fill="#667eea"/>

  <!-- Ball -->
  <circle cx="150" cy="150" r="60" fill="#ff3333" stroke="#fff" stroke-width="4">
    <radialGradient id="ballGrad" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#ff9999"/>
      <stop offset="100%" stop-color="#ff3333"/>
    </radialGradient>
  </circle>

  <!-- Ball highlight -->
  <circle cx="130" cy="130" r="15" fill="white" opacity="0.3"/>

  <!-- Goal -->
  <circle cx="250" cy="150" r="25" fill="#ffd700" stroke="#fff" stroke-width="3"/>
  <text x="250" y="155" text-anchor="middle" font-family="Arial" font-size="10" fill="#333" font-weight="bold">META</text>

  <!-- Arrow indicator -->
  <path d="M 215 150 L 235 150" stroke="#fff" stroke-width="3" marker-end="url(#arrowhead)"/>
  <polygon points="235,145 245,150 235,155" fill="#fff"/>

  <!-- Level indicator -->
  <rect x="20" y="20" width="60" height="30" rx="15" fill="rgba(0,0,0,0.4)"/>
  <text x="50" y="40" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff" font-weight="bold">5 Lv</text>
</svg>
