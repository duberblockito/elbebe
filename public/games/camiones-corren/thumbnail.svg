<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" fill="#87CEEB"/>

  <!-- Road -->
  <rect x="0" y="150" width="300" height="150" fill="#666"/>
  <line x1="0" y1="225" x2="300" y2="225" stroke="#FFD700" stroke-width="4" stroke-dasharray="20 20"/>

  <!-- Truck -->
  <rect x="50" y="180" width="120" height="60" rx="10" fill="#E74C3C"/>
  <rect x="60" y="190" width="40" height="25" rx="5" fill="#87CEEB"/>
  <circle cx="80" cy="240" r="12" fill="#333"/>
  <circle cx="140" cy="240" r="12" fill="#333"/>
  <circle cx="80" cy="240" r="6" fill="#666"/>
  <circle cx="140" cy="240" r="6" fill="#666"/>

  <!-- Title -->
  <text x="150" y="100" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="24" fill="#FF6B35">🚗 Camiones</text>
  <text x="150" y="130" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="20" fill="#FF6B35">que Corren</text>
</svg>
