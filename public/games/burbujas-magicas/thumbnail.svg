<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F7FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bubbleGradient" x1="30%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.9);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(78,205,196,0.6);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#skyGradient)"/>

  <!-- Title text at bottom -->
  <text x="150" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FF6B6B">
    Burbujas Mágicas
  </text>

  <!-- Bubbles -->
  <circle cx="80" cy="180" r="35" fill="url(#bubbleGradient)" stroke="#4ECDC4" stroke-width="2" opacity="0.9"/>
  <circle cx="65" cy="165" r="8" fill="rgba(255,255,255,0.7)" opacity="0.8"/>

  <circle cx="150" cy="140" r="50" fill="url(#bubbleGradient)" stroke="#FF6B6B" stroke-width="2" opacity="0.85"/>
  <circle cx="130" cy="120" r="12" fill="rgba(255,255,255,0.7)" opacity="0.8"/>

  <circle cx="220" cy="170" r="40" fill="url(#bubbleGradient)" stroke="#FFE66D" stroke-width="2" opacity="0.9"/>
  <circle cx="205" cy="155" r="10" fill="rgba(255,255,255,0.7)" opacity="0.8"/>

  <circle cx="100" cy="90" r="28" fill="url(#bubbleGradient)" stroke="#A855F7" stroke-width="2" opacity="0.8"/>
  <circle cx="90" cy="80" r="6" fill="rgba(255,255,255,0.7)" opacity="0.8"/>

  <circle cx="200" cy="80" r="32" fill="url(#bubbleGradient)" stroke="#EC4899" stroke-width="2" opacity="0.85"/>
  <circle cx="185" cy="65" r="7" fill="rgba(255,255,255,0.7)" opacity="0.8"/>

  <circle cx="150" cy="50" r="20" fill="url(#bubbleGradient)" stroke="#3B82F6" stroke-width="2" opacity="0.75"/>

  <!-- Sparkles -->
  <text x="50" y="50" font-size="16">✨</text>
  <text x="250" y="120" font-size="14">⭐</text>
  <text x="120" y="220" font-size="12">💫</text>
</svg>
