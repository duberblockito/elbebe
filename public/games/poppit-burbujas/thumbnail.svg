<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F7FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bgGrad)"/>

  <!-- Bubbles -->
  <circle cx="70" cy="220" r="35" fill="#FF6B6B" opacity="0.8">
    <animate attributeName="cy" values="220;200;220" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="65" cy="210" r="8" fill="rgba(255,255,255,0.6)">
    <animate attributeName="cy" values="210;190;210" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="230" cy="180" r="30" fill="#4ECDC4" opacity="0.8">
    <animate attributeName="cy" values="180;160;180" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="225" cy="170" r="6" fill="rgba(255,255,255,0.6)">
    <animate attributeName="cy" values="170;150;170" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="150" cy="140" r="40" fill="#45B7D1" opacity="0.8">
    <animate attributeName="cy" values="140;120;140" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="145" cy="130" r="8" fill="rgba(255,255,255,0.6)">
    <animate attributeName="cy" values="130;110;130" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="280" cy="250" r="25" fill="#96CEB4" opacity="0.8">
    <animate attributeName="cy" values="250;230;250" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="30" cy="280" r="28" fill="#FFEAA7" opacity="0.8">
    <animate attributeName="cy" values="280;260;280" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Pop particles effect (burst) -->
  <g>
    <circle cx="200" cy="200" r="5" fill="#FF6B6B">
      <animate attributeName="cx" values="200;190;180" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;190;180" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="4" fill="#FF6B6B">
      <animate attributeName="cx" values="200;210;220" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;190;180" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="4" fill="#FF6B6B">
      <animate attributeName="cx" values="200;190;180" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;210;220" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="4" fill="#FF6B6B">
      <animate attributeName="cx" values="200;210;220" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;210;220" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;0" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title text -->
  <text x="150" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">🫧 Poppit! Burbujas</text>
</svg>
