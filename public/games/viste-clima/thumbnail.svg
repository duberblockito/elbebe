<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" fill="#87CEEB" rx="20" ry="20"/>
  
  <!-- Sun -->
  <circle cx="250" cy="50" r="30" fill="#FFD700">
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Cloud with Rain -->
  <g transform="translate(30, 40)">
    <ellipse cx="50" cy="30" rx="40" ry="20" fill="#87CEEB"/>
    <ellipse cx="30" cy="35" rx="25" ry="15" fill="#87CEEB"/>
    <ellipse cx="70" cy="35" rx="25" ry="15" fill="#87CEEB"/>
    
    <!-- Raindrops -->
    <line x1="20" y1="55" x2="15" y2="75" stroke="#4169E1" stroke-width="3" stroke-linecap="round">
      <animate attributeName="y1" values="55;65" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="75;85" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="40" y1="60" x2="35" y2="80" stroke="#4169E1" stroke-width="3" stroke-linecap="round">
      <animate attributeName="y1" values="60;70" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="80;90" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="55" x2="55" y2="75" stroke="#4169E1" stroke-width="3" stroke-linecap="round">
      <animate attributeName="y1" values="55;65" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="75;85" dur="0.9s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Character -->
  <g transform="translate(75, 100)">
    <!-- Head -->
    <circle cx="75" cy="40" r="35" fill="#FFDAB9"/>
    
    <!-- Eyes -->
    <circle cx="60" cy="35" r="6" fill="#333"/>
    <circle cx="90" cy="35" r="6" fill="#333"/>
    
    <!-- Smile -->
    <path d="M 60 55 Q 75 70 90 55" stroke="#333" stroke-width="3" fill="none"/>
    
    <!-- Hair -->
    <ellipse cx="75" cy="15" rx="30" ry="15" fill="#8B4513"/>
    
    <!-- Body/Shirt -->
    <rect x="45" y="75" width="60" height="70" rx="10" fill="#FFD700"/>
    
    <!-- Pants -->
    <rect x="50" y="145" width="25" height="40" rx="5" fill="#FF6347"/>
    <rect x="75" y="145" width="25" height="40" rx="5" fill="#FF6347"/>
    
    <!-- Arms -->
    <rect x="25" y="80" width="20" height="50" rx="10" fill="#FFD700"/>
    <rect x="105" y="80" width="20" height="50" rx="10" fill="#FFD700"/>
  </g>
  
  <!-- Clothing Icons -->
  <g transform="translate(30, 230)">
    <!-- T-shirt -->
    <rect x="0" y="0" width="50" height="40" rx="5" fill="#FFD700" stroke="#333" stroke-width="2"/>
    <text x="25" y="25" font-size="12" text-anchor="middle" fill="#333">☀️</text>
    
    <!-- Raincoat -->
    <rect x="60" y="0" width="50" height="40" rx="5" fill="#4169E1" stroke="#333" stroke-width="2"/>
    <text x="85" y="25" font-size="12" text-anchor="middle" fill="#FFF">🌧️</text>
    
    <!-- Coat -->
    <rect x="120" y="0" width="50" height="40" rx="5" fill="#DC143C" stroke="#333" stroke-width="2"/>
    <text x="145" y="25" font-size="12" text-anchor="middle" fill="#FFF">❄️</text>
    
    <!-- Pants -->
    <rect x="180" y="0" width="50" height="40" rx="5" fill="#FF6347" stroke="#333" stroke-width="2"/>
    <text x="205" y="25" font-size="12" text-anchor="middle" fill="#333">👖</text>
  </g>
  
  <!-- Title -->
  <text x="150" y="295" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Vístete para el Clima</text>
</svg>