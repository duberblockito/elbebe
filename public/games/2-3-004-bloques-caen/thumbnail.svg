<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Background -->
  <rect width="300" height="300" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect y="200" width="300" height="100" fill="#81C784"/>
  
  <!-- Triangle Block (red) -->
  <polygon points="50,150 100,50 150,150" fill="#ef4444" stroke="#000" stroke-width="2"/>
  
  <!-- Circle Block (blue) -->
  <circle cx="150" cy="100" r="40" fill="#3b82f6" stroke="#000" stroke-width="2"/>
  
  <!-- Square Block (orange) -->
  <rect x="200" y="60" width="80" height="80" rx="10" fill="#f59e0b" stroke="#000" stroke-width="2"/>
  
  <!-- Title Text -->
  <text x="150" y="280" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937" font-family="Arial, sans-serif">Los Bloques Caen</text>
</svg>
