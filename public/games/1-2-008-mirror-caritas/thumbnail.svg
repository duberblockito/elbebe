  <path d="M 55 245 Q 70 255 85 245" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round" />
  
  <!-- Title -->
  <text x="150" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">
    Emociones
