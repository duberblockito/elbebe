  <path d="M 110 170 Q 150 210 190 170" stroke="#333" stroke-width="10" fill="none" stroke-linecap="round" />
  
  <!-- Sad Face -->
  <circle cx="230" cy="220" r="50" fill="#87CEEB" />
  <circle cx="220" cy="210" r="8" fill="#333" />
  <circle cx="240" cy="210" r="8" fill="#333" />
  <path d="M 215 225 Q 230 205 245 225" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round" />
  
  <!-- Angry Face -->
  <circle cx="70" cy="220" r="50" fill="#FF6B6B" />
  <path d="M 45 200 L 65 215" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round" />
  <path d="M 95 200 L 75 215" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round" />
  <circle cx="60" cy="225" r="8" fill="#333" />
