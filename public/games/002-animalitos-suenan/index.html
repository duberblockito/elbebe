<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animalitos que Suenan | El Bebe</title>
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
  <div class="game-container">
    <div class="header">
      <h1 class="game-title">🐕 Animalitos que Suenan</h1>
      <p class="subtitle">Toca, Escucha y Aprende</p>
    </div>

    <!-- HUD: Heads Up Display -->
    <div class="hud">
      <div class="hud-section">
        <div class="hud-label">Nivel</div>
        <div class="hud-value" id="levelDisplay">1/5</div>
      </div>
      
      <div class="hud-section">
        <div class="hud-label">Progreso</div>
        <div class="progress-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="hud-value" id="progressText">0/5</div>
      </div>
      
      <div class="hud-section">
        <div class="hud-label">Tiempo</div>
        <div class="timer-container">
          <div class="timer-bar" id="timerBar"></div>
        </div>
        <div class="hud-value" id="timerText">30s</div>
      </div>
    </div>

    <div class="game-board" id="gameBoard">
      <!-- Animal icons will be generated by JavaScript -->
    </div>

    <div class="controls">
      <div class="instruction">Toca un animalito para escuchar el sonido</div>
    </div>

    <div class="footer">
      <button id="btn-home" class="btn-primary">
        <span class="icon">🏠</span> Inicio
      </button>
    </div>
  </div>

  <script src="js/game.js"></script>
  <script src="../../js/main.js"></script>
</body>
</html>
