<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caja de Sonidos Mágica | El Bebe</title>
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
  <div class="game-container">
    <div class="header">
      <h1 class="game-title">🎵 Caja de Sonidos Mágica</h1>
      <p class="subtitle">Toca, Escucha y Aprende</p>
    </div>

    <!-- HUD (Heads-Up Display) -->
    <div class="hud-container">
      <!-- Level Display -->
      <div class="hud-item level-display">
        <div class="hud-label">🎯 Nivel</div>
        <div class="hud-value" id="level-display">1/5</div>
      </div>

      <!-- Timer Display -->
      <div class="hud-item timer-display">
        <div class="hud-label">⏱️ Tiempo</div>
        <div class="hud-value" id="timer-display">30s</div>
      </div>

      <!-- Progress Display -->
      <div class="hud-item progress-display">
        <div class="hud-label">🔊 Sonidos</div>
        <div class="progress-container">
          <div class="progress-bar" id="progress-bar">0/5</div>
        </div>
      </div>
    </div>

    <div class="game-board" id="gameBoard">
      <!-- Sound icons will be generated by JavaScript -->
    </div>

    <div class="controls">
      <div class="instruction">Toca un icono para escuchar el sonido</div>
    </div>

    <div class="footer">
      <button id="btn-home" class="btn-primary">
        <span class="icon">🏠</span> Inicio
      </button>
    </div>
  </div>

  <script src="js/game.js"></script>
  <script src="../../js/main.js"></script>
</body>
</html>
