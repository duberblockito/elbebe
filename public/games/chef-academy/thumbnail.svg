<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg-gradient)" rx="20" />

  <!-- Chef Hat -->
  <text x="100" y="90" font-size="70" text-anchor="middle">👨‍🍳</text>

  <!-- Title -->
  <text x="100" y="130" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Chef Academy</text>

  <!-- Star Rating -->
  <text x="100" y="155" font-size="20" text-anchor="middle">⭐⭐⭐</text>

  <!-- Cooking Icon -->
  <text x="100" y="180" font-size="24" text-anchor="middle">🍳</text>
</svg>
