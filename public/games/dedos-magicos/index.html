<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dedos Mágicos - Juegos para Bebés</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="assets/game.css">
</head>
<body class="game-body">
    <div id="game-container">
        <!-- Modo selección -->
        <div id="mode-selection" class="mode-selection">
            <h1 class="game-title">🌟 Dedos Mágicos</h1>
            <p class="game-description">¡Toca la pantalla para crear luces mágicas!</p>
            <div class="mode-buttons">
                <button class="mode-btn" onclick="game.startFreeMode()">
                    <span class="mode-icon">🎨</span>
                    <span class="mode-text">Experiencia Libre</span>
                    <span class="mode-desc">Crea sin límites</span>
                </button>
                <button class="mode-btn" onclick="game.startLevelMode()">
                    <span class="mode-icon">⭐</span>
                    <span class="mode-text">Modo Niveles</span>
                    <span class="mode-desc">¡Desafíos divertidos!</span>
                </button>
            </div>
        </div>

        <!-- HUD (Modo Niveles) -->
        <div id="hud" class="hud" style="display: none;">
            <div class="hud-section">
                <span class="hud-label">Nivel</span>
                <span id="level-display" class="hud-value">1</span>
            </div>
            <div class="hud-section">
                <span class="hud-label">Estrellas</span>
                <span id="stars-display" class="hud-value">0</span>
                <span class="hud-target">/ <span id="target-display">10</span></span>
            </div>
            <div class="hud-section">
                <button class="exit-btn" onclick="game.exitToMenu()">🏠</button>
            </div>
        </div>

        <!-- Barra de progreso -->
        <div id="progress-container" class="progress-container" style="display: none;">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <span id="progress-text" class="progress-text">0%</span>
        </div>

        <!-- Canvas del juego -->
        <canvas id="game-canvas"></canvas>

        <!-- Modals -->
        <div id="modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2 id="modal-title"></h2>
                <p id="modal-message"></p>
                <button id="modal-btn" class="modal-btn"></button>
            </div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
