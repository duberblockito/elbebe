<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" fill="#7CB342"/>

  <!-- Soil -->
  <ellipse cx="150" cy="250" rx="120" ry="30" fill="#5D4037"/>

  <!-- Plant Stem -->
  <path d="M150 250 L150 120" stroke="#4CAF50" stroke-width="8" stroke-linecap="round"/>

  <!-- Leaves -->
  <ellipse cx="120" cy="200" rx="30" ry="15" fill="#66BB6A" transform="rotate(-30 120 200)"/>
  <ellipse cx="180" cy="180" rx="30" ry="15" fill="#66BB6A" transform="rotate(30 180 180)"/>
  <ellipse cx="140" cy="150" rx="25" ry="12" fill="#66BB6A" transform="rotate(-20 140 150)"/>
  <ellipse cx="160" cy="130" rx="25" ry="12" fill="#66BB6A" transform="rotate(20 160 130)"/>

  <!-- Flower -->
  <circle cx="150" cy="100" r="25" fill="#FFEB3B"/>
  <circle cx="125" cy="100" r="12" fill="#F44336"/>
  <circle cx="175" cy="100" r="12" fill="#F44336"/>
  <circle cx="150" cy="75" r="12" fill="#F44336"/>
  <circle cx="150" cy="125" r="12" fill="#F44336"/>
  <circle cx="150" cy="100" r="8" fill="#FF9800"/>

  <!-- Sun -->
  <circle cx="250" cy="50" r="20" fill="#FFC107"/>
  <g stroke="#FFC107" stroke-width="3">
    <line x1="250" y1="20" x2="250" y2="30"/>
    <line x1="250" y1="70" x2="250" y2="80"/>
    <line x1="220" y1="50" x2="230" y2="50"/>
    <line x1="270" y1="50" x2="280" y2="50"/>
    <line x1="229" y1="29" x2="236" y2="36"/>
    <line x1="264" y1="64" x2="271" y2="71"/>
    <line x1="229" y1="71" x2="236" y2="64"/>
    <line x1="264" y1="36" x2="271" y2="29"/>
  </g>

  <!-- Watering Can -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="40" height="50" rx="5" fill="#2196F3"/>
    <rect x="35" y="20" width="20" height="10" rx="2" fill="#1976D2"/>
    <ellipse cx="20" cy="55" rx="5" ry="3" fill="#1976D2"/>
  </g>

  <!-- Text -->
  <text x="150" y="290" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Pequeño Jardinero</text>
</svg>
