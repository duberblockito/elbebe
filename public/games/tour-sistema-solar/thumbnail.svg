<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <radialGradient id="spaceGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c0c1e;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="300" height="300" fill="url(#spaceGradient)"/>
  
  <!-- Stars -->
  <circle cx="50" cy="50" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="150" cy="30" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="250" cy="60" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="80" cy="200" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="220" cy="180" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="100" cy="120" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="200" cy="100" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="50" cy="250" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="280" cy="220" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="30" cy="150" r="1" fill="#ffffff" opacity="0.5"/>
  
  <!-- Sun -->
  <circle cx="150" cy="80" r="35" fill="#ffd700" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.7;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="80" r="40" fill="#ffd700" opacity="0.3"/>
  
  <!-- Saturn -->
  <ellipse cx="150" cy="200" rx="60" ry="15" fill="#f39c12" opacity="0.6" transform="rotate(-15 150 200)"/>
  <circle cx="150" cy="200" r="35" fill="#f39c12"/>
  
  <!-- Earth -->
  <circle cx="80" cy="150" r="18" fill="#3498db"/>
  <path d="M 75 145 Q 80 140 85 145" stroke="#2ecc71" stroke-width="3" fill="none"/>
  
  <!-- Mars -->
  <circle cx="220" cy="150" r="15" fill="#e74c3c"/>
  
  <!-- Jupiter -->
  <circle cx="150" cy="140" r="45" fill="#e67e22"/>
  <ellipse cx="150" cy="130" rx="40" ry="8" fill="#d35400" opacity="0.5"/>
  <ellipse cx="150" cy="150" rx="40" ry="8" fill="#d35400" opacity="0.5"/>
  
  <!-- Text -->
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Tour del Sistema Solar</text>
  <text x="150" y="295" font-family="Arial, sans-serif" font-size="12" fill="#ffd700" text-anchor="middle">🚀 Explora el Espacio</text>
</svg>
