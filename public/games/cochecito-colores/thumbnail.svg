<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Background -->
  <rect width="300" height="300" fill="#87CEEB"/>
  
  <!-- Sun -->
  <circle cx="250" cy="50" r="40" fill="#FFD700"/>
  
  <!-- Clouds -->
  <ellipse cx="80" cy="60" rx="40" ry="20" fill="white" opacity="0.9"/>
  <ellipse cx="100" cy="55" rx="30" ry="18" fill="white" opacity="0.9"/>
  
  <!-- Road -->
  <rect x="0" y="200" width="300" height="100" fill="#4a4a4a"/>
  <line x1="0" y1="250" x2="300" y2="250" stroke="white" stroke-width="4" stroke-dasharray="20,15"/>
  
  <!-- Car body (multicolor representation) -->
  <rect x="100" y="160" width="100" height="50" rx="10" fill="#FF6B6B"/>
  <rect x="115" y="140" width="70" height="25" rx="5" fill="#4ECDC4"/>
  
  <!-- Windows -->
  <rect x="125" y="145" width="50" height="18" rx="3" fill="#87CEEB" opacity="0.7"/>
  
  <!-- Wheels -->
  <circle cx="125" cy="215" r="15" fill="#333"/>
  <circle cx="175" cy="215" r="15" fill="#333"/>
  <circle cx="125" cy="215" r="8" fill="#666"/>
  <circle cx="175" cy="215" r="8" fill="#666"/>
  
  <!-- Headlights -->
  <circle cx="195" cy="175" r="5" fill="#FFD700"/>
  <circle cx="195" cy="185" r="5" fill="#FFD700"/>
  
  <!-- Text -->
  <text x="150" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333" font-weight="bold">¡Tócame!</text>
</svg>