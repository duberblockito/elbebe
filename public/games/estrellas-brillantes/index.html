<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estrellas Brillantes - El Bebe Games</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="assets/game.css">
</head>
<body class="game-container">
    <nav class="game-nav">
        <a href="../../index.html" class="nav-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            Inicio
        </a>
    </nav>

    <div class="game-wrapper">
        <!-- HUD -->
        <div class="game-hud">
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="stat-label">Nivel</span>
                    <span class="stat-value" id="level">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Estrellas</span>
                    <span class="stat-value"><span id="stars">0</span>/<span id="target">5</span></span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Tiempo</span>
                    <span class="stat-value" id="timer">30s</span>
                </div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar-container">
            <div class="progress-bar-label">Progreso</div>
            <div class="progress-bar">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Timer Bar -->
        <div class="timer-bar-container">
            <div class="timer-bar" id="timerBar"></div>
        </div>

        <!-- Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Level Complete Modal -->
        <div class="modal" id="levelCompleteModal">
            <div class="modal-content">
                <h2>¡Nivel Completado! ⭐</h2>
                <p>¡Has capturado todas las estrellas!</p>
                <button class="modal-btn" id="nextLevelBtn">Siguiente Nivel</button>
            </div>
        </div>

        <!-- Time's Up Modal -->
        <div class="modal" id="timeUpModal">
            <div class="modal-content">
                <h2>¡Tiempo Agotado! ⏰</h2>
                <p>¡Casi lo logras! Intenta de nuevo.</p>
                <button class="modal-btn" id="retryBtn">Intentar de Nuevo</button>
            </div>
        </div>

        <!-- Game Complete Modal -->
        <div class="modal" id="gameCompleteModal">
            <div class="modal-content">
                <h2>🎉 ¡Juego Completado! 🎉</h2>
                <p>¡Eres un experto en estrellas!</p>
                <button class="modal-btn" id="homeBtn">Volver al Inicio</button>
            </div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
