<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" rx="30" fill="#FFB6C1"/>
  
  <!-- Musical notes -->
  <circle cx="80" cy="80" r="25" fill="#FF69B4" opacity="0.8"/>
  <text x="80" y="88" font-size="30" text-anchor="middle" fill="white">♪</text>
  
  <circle cx="220" cy="80" r="25" fill="#87CEEB" opacity="0.8"/>
  <text x="220" y="88" font-size="30" text-anchor="middle" fill="white">♫</text>
  
  <!-- Animals -->
  <text x="60" y="200" font-size="70">🐵</text>
  <text x="140" y="200" font-size="70">🐱</text>
  <text x="220" y="200" font-size="70">🐶</text>
  
  <!-- Stars decoration -->
  <text x="50" y="40" font-size="20">⭐</text>
  <text x="260" y="40" font-size="20">⭐</text>
  <text x="150" y="280" font-size="20">✨</text>
</svg>
