<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chef de Monstruos | El Bebe Games</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <!-- Header del Nivel -->
  <div class="level-header">
    <div class="level-indicator">
      <span class="level-icon">🎯</span>
      <span>Nivel</span>
      <span id="currentLevel">1</span>
      <span>/</span>
      <span id="totalLevels">5</span>
    </div>
    <div class="header-buttons">
      <button onclick="goToMenu()" class="btn-menu">🏠</button>
    </div>
  </div>

  <!-- HUD del Juego -->
  <div class="game-hud">
    <div class="timer-container">
      <div class="timer-bar">
        <div class="timer-fill" id="timerFill"></div>
      </div>
      <div class="timer-text">
        <span class="timer-icon">⏱️</span>
        <span id="timeRemaining">40</span>s
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text">
        <span id="completedOrders">0</span> / <span id="totalOrders">3</span> pedidos
      </div>
    </div>
  </div>

  <!-- Área de Juego Principal -->
  <div class="game-container">
    <!-- Contenedor de Monstruos -->
    <div class="monsters-container" id="monstersContainer">
      <!-- Los monstruos se generan dinámicamente aquí -->
    </div>

    <!-- Chef's Station (Ingredientes Disponibles) -->
    <div class="chef-station">
      <div class="chef-header">
        <span class="chef-icon">👨‍🍳</span>
        <h3>Ingredientes Disponibles</h3>
      </div>
      <div class="ingredients-tray" id="ingredientsTray">
        <!-- Los ingredientes se generan dinámicamente aquí -->
      </div>
    </div>
  </div>

  <!-- Modal: Nivel Completado -->
  <div class="modal" id="levelCompleteModal">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <h2 class="modal-title">¡Nivel Completado!</h2>
      <p class="modal-text">Completaste todos los pedidos</p>
      <div class="modal-stats">
        <div class="stat-item">
          <span class="stat-value" id="ordersCompleted">0</span>
          <span class="stat-label">Pedidos</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="monstersFed">0</span>
          <span class="stat-label">Monstruos</span>
        </div>
      </div>
      <button onclick="nextLevel()" class="btn-primary">Siguiente Nivel →</button>
    </div>
  </div>

  <!-- Modal: Tiempo Agotado -->
  <div class="modal" id="timeUpModal">
    <div class="modal-content">
      <div class="modal-icon">⏰</div>
      <h2 class="modal-title">¡Se Acabó el Tiempo!</h2>
      <p class="modal-text">Pedidos completados: <span id="ordersCompleted">0</span> de <span id="ordersTarget">3</span></p>
      <button onclick="retryLevel()" class="btn-primary">Intentar de Nuevo</button>
      <button onclick="goToMenu()" class="btn-secondary">Volver al Menú</button>
    </div>
  </div>

  <!-- Modal: Juego Completado -->
  <div class="modal" id="gameCompleteModal">
    <div class="modal-content">
      <div class="modal-icon">🎊</div>
      <h2 class="modal-title">¡Juego Completado!</h2>
      <p class="modal-text">¡Eres un Chef de Monstruos experto!</p>
      <div class="modal-stats">
        <div class="stat-item">
          <span class="stat-value" id="totalOrdersComplete">0</span>
          <span class="stat-label">Total Pedidos</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="totalMonstersComplete">0</span>
          <span class="stat-label">Total Monstruos</span>
        </div>
      </div>
      <button onclick="playAgain()" class="btn-primary">Jugar de Nuevo</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="game.js"></script>
</body>
</html>
