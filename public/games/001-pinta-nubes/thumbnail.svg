<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" fill="#E0F4FF"/>

  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F4FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main cloud shape -->
  <ellipse cx="150" cy="180" rx="100" ry="50" fill="#D3D3D3"/>
  <ellipse cx="150" cy="160" rx="80" ry="40" fill="#E8E8E8"/>
  <circle cx="100" cy="160" r="50" fill="#F0F0F0"/>
  <circle cx="200" cy="160" r="50" fill="#F0F0F0"/>
  <circle cx="150" cy="130" r="60" fill="#FFFFFF"/>

  <!-- Animal peeking from cloud -->
  <circle cx="150" cy="175" r="25" fill="#FFB6C1"/>
  <circle cx="140" cy="170" r="5" fill="#333"/>
  <circle cx="160" cy="170" r="5" fill="#333"/>
  <path d="M 145 180 Q 150 185 155 180" stroke="#333" stroke-width="2" fill="none"/>

  <!-- Paint brush icon -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="15" height="60" fill="#8B4513" transform="rotate(-30 7.5 30)"/>
    <ellipse cx="20" cy="-10" rx="20" ry="30" fill="#FFD700" transform="rotate(-30 7.5 30)"/>
  </g>

  <!-- Splash effects -->
  <circle cx="220" cy="100" r="8" fill="#FF6B6B" opacity="0.7"/>
  <circle cx="240" cy="130" r="6" fill="#4ECDC4" opacity="0.7"/>
  <circle cx="80" cy="120" r="7" fill="#45B7D1" opacity="0.7"/>
  <circle cx="70" cy="160" r="5" fill="#FFA07A" opacity="0.7"/>

  <!-- Game title -->
  <text x="150" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">
    Pinta las Nubes
  </text>
</svg>
