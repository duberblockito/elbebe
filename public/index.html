<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Juegos divertidos y educativos para niños de 0 a 15 años. Fun and educational games for kids aged 0 to 15.">
    <meta name="keywords" content="juegos para niños, kids games, educational games, juegos educativos">
    <meta name="author" content="El Bebe Games">

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="elbebe: Juegos para Susana y Julieta">
    <meta property="og:description" content="Juegos divertidos y educativos para niños de 0 a 15 años">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <title data-i18n="siteTitle">elbebe: Juegos para Susana y Julieta</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Skip link for accessibility -->
    <a href="#games-grid" class="skip-link">Skip to main content</a>

    <main class="site-main" role="main">
        
        <!-- Age Filter Section (Moved Top) -->
        <section class="filters-section">
            <div class="filter-header">
                <span class="filter-label" data-i18n="selectAge">Selecciona Edad:</span>
            </div>
            
            <div class="age-filter" role="group" aria-label="Filter games by age">
                <button class="age-filter-btn active" data-age="all" type="button" aria-pressed="true">
                    <span data-i18n="allAges">Todas</span>
                </button>
                <button class="age-filter-btn" data-age="0-1" type="button" aria-pressed="false">
                    <span data-i18n="ageGroups.0-1">0-1 años</span>
                </button>
                <button class="age-filter-btn" data-age="1-2" type="button" aria-pressed="false">
                    <span data-i18n="ageGroups.1-2">1-2 años</span>
                </button>
                <button class="age-filter-btn" data-age="2-3" type="button" aria-pressed="false">
                    <span data-i18n="ageGroups.2-3">2-3 años</span>
                </button>
                <button class="age-filter-btn" data-age="3-5" type="button" aria-pressed="false">
                    <span data-i18n="ageGroups.3-5">3-5 años</span>
                </button>
                <button class="age-filter-btn" data-age="5-8" type="button" aria-pressed="false">
                    <span data-i18n="ageGroups.5-8">5-8 años</span>
                </button>
                <button class="age-filter-btn" data-age="8-15" type="button" aria-pressed="false">
                    <span data-i18n="ageGroups.8-15">8-15 años</span>
                </button>
            </div>
        </section>

        <!-- Hero Section (Featured Game) -->
        <section id="hero" class="hero">
            <h1 class="hero-title" data-i18n="heroTitle">¡Juegos Divertidos para Pequeños!</h1>
            <p class="hero-subtitle" data-i18n="heroSubtitle">
                Descubre juegos coloridos y educativos diseñados especialmente para niños de 0 a 15 años
            </p>
        </section>

        <!-- Loading State -->
        <div id="gamesLoading" class="loading" aria-hidden="true">
            <div class="loading-spinner"></div>
        </div>

        <!-- Games Grid -->
        <section id="games-section" class="games-section">
            <div id="gamesGrid" class="games-grid" role="list" aria-label="Available games">
                <!-- Games will be dynamically loaded here -->
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
